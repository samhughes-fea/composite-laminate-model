[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laminate-constitutive-model"
dynamic = ["version"]
description = "Ply and laminate constitutive behaviour of composites: 3D orthotropic materials, laminates and ABD, CLPT/FSDT/zig-zag/layerwise section stiffness, hygrothermal resultants and failure criteria."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Hughes" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.22"]
keywords = [
    "composites", "laminate", "classical laminate theory", "ABD", "zig-zag theory",
    "failure criteria", "Tsai-Wu", "Hashin", "orthotropic materials",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5", "build>=1.0", "twine>=5"]

[project.urls]
Homepage = "https://github.com/samhughes-fea/laminate-constitutive-model"
Source = "https://github.com/samhughes-fea/laminate-constitutive-model"
Issues = "https://github.com/samhughes-fea/laminate-constitutive-model/issues"
Changelog = "https://github.com/samhughes-fea/laminate-constitutive-model/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "laminate_constitutive_model.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
